<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>運彩模擬實驗</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--sub:#475569;--muted:#64748b;--line:#e2e8f0;--track:#e8edf3;--win:#15803d;--loss:#dc2626;--pend:#b45309;--acc:#1d4ed8;--tick:#0f172a;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121a2b;--ink:#e6edf7;--sub:#b3c0d4;--muted:#8b9ab0;--line:#223049;--track:#1c2840;--win:#4ade80;--loss:#f87171;--pend:#fbbf24;--acc:#7aa2ff;--tick:#e6edf7;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.win{color:var(--win)}.loss{color:var(--loss)}.pending{color:var(--pend)}.void{color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.warn{color:var(--pend);font-size:11px;font-weight:600;margin-left:6px;padding:1px 6px;border:1px solid currentColor;border-radius:999px;white-space:nowrap}
.pm{color:var(--muted);font-size:12px;font-weight:400}

/* 鎖定畫面 */
#lock{max-width:340px;margin:18vh auto;padding:28px 24px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
#lock input{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#lock button{margin-top:12px;width:100%;padding:11px;font-size:16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600}
.err{color:var(--loss);font-size:13px;min-height:18px;margin-top:6px}

/* 頂部 */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:800;letter-spacing:.3px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:12px;margin-top:6px}
.ptabs{position:sticky;top:0;z-index:10;display:flex;gap:4px;margin:16px -4px 14px;padding:6px 4px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.ptabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);padding:9px 6px;font-size:14px;border-radius:10px;font-weight:500}
.ptabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* 區塊 */
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.sec span{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}

/* 總覽 */
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:12px;letter-spacing:.3px}
.kpi b{display:block;font-size:28px;line-height:1.25;font-weight:800}
.kpi.main b{font-size:38px}.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.sb{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--track);margin:14px 0 6px}
.sb i{display:block;height:100%}.sb .w{background:var(--win)}.sb .l{background:var(--loss)}.sb .p{background:var(--pend);opacity:.55}
.sbl{display:flex;gap:16px;font-size:12px;color:var(--muted)}.sbl i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.note-box{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;color:var(--sub);box-shadow:var(--shadow)}
.note-box.pd{border-left-color:var(--pend)}.note-box b{color:var(--ink)}
.desc{font-size:13px;color:var(--muted);margin:10px 2px}

/* 排行 */
.rkh,.rk{display:grid;grid-template-columns:26px 168px 92px minmax(180px,1fr) 170px;gap:0 14px;align-items:center}
.rkh{padding:0 16px 6px;font-size:11px;color:var(--muted);letter-spacing:.4px}
.rkh .mid{display:flex;justify-content:space-between}
.rk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0;box-shadow:var(--shadow)}
.rk .no{width:24px;height:24px;border-radius:50%;background:var(--track);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rk .no.first{background:var(--ink);color:var(--bg)}
.rk .nm{font-weight:700;display:flex;align-items:center;gap:8px}.rk .nm i{width:10px;height:10px;border-radius:3px;flex:none}
.rk .ct{font-size:12px;color:var(--muted);margin-top:1px}
.rk .rv{font-size:22px;font-weight:800;line-height:1.2}
.rk .hit{font-size:13px;line-height:1.4}.rk .hit b{font-size:16px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.chip.win{background:rgba(21,128,61,.12)}.chip.loss{background:rgba(220,38,38,.12)}
.strip{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.strip i{width:12px;height:12px;border-radius:3px;background:var(--track)}.strip .w{background:var(--win)}.strip .l{background:var(--loss)}.strip .p{background:transparent;border:1.5px dashed var(--pend)}
.trk{position:relative;height:14px;border-radius:7px;background:var(--track)}
.trk .band{position:absolute;top:0;bottom:0;background:var(--ink);opacity:.13;border-radius:7px}
.trk .f2{position:absolute;top:3px;bottom:3px;border-radius:4px}.trk .f2.win{background:var(--win)}.trk .f2.loss{background:var(--loss)}
.trk .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--tick);opacity:.8}
.trk.thin{height:8px;flex:1}.trk .f{position:absolute;left:0;top:0;bottom:0;border-radius:4px}.trk .f.acc{background:var(--acc)}.trk .f.gry{background:var(--muted);opacity:.55}
.hb{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--muted)}.hb .hl{width:28px}.hb .hv{width:38px;text-align:right;color:var(--ink)}

/* 走勢圖 */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}.chart .ref{stroke:var(--muted);stroke-dasharray:4 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--sub);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* 表格 */
.tbw{overflow-x:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:430px;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:12px;background:var(--bg)}
.mb{display:inline-block;width:44px;height:6px;border-radius:3px;background:var(--track);margin-left:8px;vertical-align:middle;overflow:hidden}
.mb i{display:block;height:100%;background:var(--acc)}.mb i.win{background:var(--win)}.mb i.loss{background:var(--loss)}.mb i.pend{background:var(--pend)}
details.adv{margin:26px 0 0}details.adv>summary{cursor:pointer;font-weight:700;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;list-style:none;box-shadow:var(--shadow)}
details.adv>summary::before{content:'▸ ';color:var(--muted)}details.adv[open]>summary::before{content:'▾ '}
details.adv h3{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin:22px 0 8px}

/* 串關清單 */
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 14px;font-size:13px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.rd{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:22px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0;box-shadow:var(--shadow)}
.card.s-win{border-left-color:var(--win)}.card.s-loss{border-left-color:var(--loss)}.card.s-pending{border-left-color:var(--pend)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.hd .nm{font-weight:700;display:flex;align-items:center;gap:8px}.hd .nm i{width:10px;height:10px;border-radius:3px}
.hd .odds{font-weight:400;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.w{background:rgba(21,128,61,.12);color:var(--win)}.pill.l{background:rgba(220,38,38,.10);color:var(--loss)}.pill.p{background:rgba(180,83,9,.12);color:var(--pend)}
.leg{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.leg:first-of-type{border-top:0}.leg .m{color:var(--muted);font-size:12px;margin-top:1px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;flex:none}
.dot.w{background:var(--win)}.dot.l{background:var(--loss)}.dot.p{background:transparent;border:1.5px dashed var(--pend);color:var(--pend)}.dot.v{background:var(--muted)}
.why{font-size:12px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.note{font-size:12px;color:var(--muted);margin-top:26px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr 1fr}.kpi.main{grid-column:1 / -1}
  .rkh{display:none}
  .rk{grid-template-columns:26px 1fr auto;gap:6px 10px}
  .rk .rb{grid-column:1 / -1}.rk .hit{grid-column:1 / -1}.rk .strip{grid-column:1 / -1}
  .rk .rv{text-align:right}
}
</style>
</head>

<div id="lock">
  <div style="font-weight:700;font-size:17px;margin-bottom:12px">運彩模擬實驗</div>
  <input id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password">
  <button id="go">進入</button>
  <div class="err" id="err"></div>
</div>
<div class="wrap" id="app" hidden></div>

  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},k,ub(P.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw,remember){
  try{const d=await dec(pw);if(remember){try{sessionStorage.setItem('pw',pw)}catch(e){}}
    document.getElementById('lock').hidden=true;render(d);}
  catch(e){document.getElementById('err').textContent='密碼錯誤';}
}
document.getElementById('go').onclick=()=>unlock(document.getElementById('pw').value,true);

const NAMES={A:'A 數據商模型',B:'B 戰績模型',C:'C 專家推薦',D:'D 國外盤口',E:'E 對照組',F:'精選・穩健',G:'精選・平衡',H:'精選・價值'};
const MARK={win:'<span class="dot w">✓</span>',loss:'<span class="dot l">✕</span>',pending:'<span class="dot p">…</span>',void:'<span class="dot v">↩</span>'};
const SC={A:'#2f6fd0',B:'#e07b00',C:'#1a9e6f',D:'#b03a9a',E:'#7a7f8a',F:'#2f6fd0',G:'#e07b00',H:'#1a9e6f'};
const mb=(v,c)=>v==null?'':`<span class="mb"><i class="${c||''}" style="width:${Math.max(0,Math.min(1,v))*100}%"></i></span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=iso=>{if(!iso)return'';const d=new Date(iso);const p=n=>String(n).padStart(2,'0');
  const tw=new Date(d.getTime()+8*3600e3);return `${p(tw.getUTCMonth()+1)}/${p(tw.getUTCDate())} ${p(tw.getUTCHours())}:${p(tw.getUTCMinutes())}`};
const pct=v=>v==null?'—':(v*100).toFixed(0)+'%';
function stats(T,keys){
  const s={};for(const k of keys)s[k]={n:0,set:0,win:0,stake:0,ret:0,lw:0,ls:0,rs:[],oSum:0,iSum:0,lg:0,tOdds:0,maxRet:0,streak:0,maxStreak:0};
  const asc=T.slice().sort((a,b)=>(a.created||'').localeCompare(b.created||''));
  for(const x of asc){const r=s[x.source];if(!r)continue;r.n++;r.tOdds+=+x.odds||0;
    if(x.status!=='pending'){r.set++;const st=x.stake||100;r.stake+=st;r.ret+=x.ret||0;r.rs.push((x.ret||0)/st);if((x.ret||0)>r.maxRet)r.maxRet=x.ret||0;
      if(x.status==='win'){r.win++;r.streak=0}else{r.streak++;if(r.streak>r.maxStreak)r.maxStreak=r.streak}}
    for(const l of x.legs||[]){if(l.result==='win'){r.lw++;r.ls++}else if(l.result==='loss')r.ls++;
      if((l.result==='win'||l.result==='loss')&&+l.odds>1){r.lg++;r.oSum+=+l.odds;r.iSum+=1/+l.odds}}}
  return s;
}
const SMALL=30;
function ci(rs){const n=rs.length;if(n<2)return null;const m=rs.reduce((a,b)=>a+b,0)/n;const v=rs.reduce((a,b)=>a+(b-m)*(b-m),0)/(n-1);return v>0?1.96*Math.sqrt(v/n):null}
function mkt(m){m=String(m||'');if(m.includes('大小'))return'大小';if(m.startsWith('不讓分'))return'不讓分';if(m.includes('讓分'))return'讓分';return m.replace(/[(（].*$/,'').trim()||'其他'}
function chart(T,keys){
  const rd={};for(const x of T){if(x.status==='pending')continue;const k=x.round;if(!rd[k]||x.created<rd[k])rd[k]=x.created}
  const rounds=Object.keys(rd).sort((a,b)=>rd[a].localeCompare(rd[b]));if(rounds.length<2)return'';
  const ser=keys.split('').map(k=>{let st=0,rt=0;return{k,pts:rounds.map(r=>{for(const x of T)if(x.source===k&&x.status!=='pending'&&x.round===r){st+=x.stake||100;rt+=x.ret||0}return st?rt/st:null})}});
  const all=ser.flatMap(s=>s.pts).filter(v=>v!=null);const hi=Math.max(1.2,...all)*1.05,W=720,H=260,L=44,R=64,Tp=12,B=26;
  const X=i=>L+(W-L-R)*(rounds.length>1?i/(rounds.length-1):0.5),Y=v=>Tp+(H-Tp-B)*(1-v/hi);
  let g='';for(const v of [0,0.5,1,1.5,2,3,4].filter(v=>v<=hi))g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="${v===1?'ref':''}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${Math.round(v*100)}%</text>`;
  g+=`<text x="${W-R+4}" y="${Y(1)-4}" style="font-size:9px">打平 100%</text>`;
  g+=`<text x="${L}" y="${H-8}">第 1 輪</text><text x="${W-R}" y="${H-8}" text-anchor="end">第 ${rounds.length} 輪</text>`;
  const ends=[];
  ser.forEach(s=>{const pts=s.pts.map((v,j)=>v==null?null:[X(j),Y(v)]).filter(Boolean);if(!pts.length)return;
    g+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${SC[s.k]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const e=pts[pts.length-1];g+=`<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3.5" fill="${SC[s.k]}"/>`;
    const last=[...s.pts].reverse().find(v=>v!=null);ends.push({k:s.k,y:e[1],v:last,x:e[0]})});
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<12)ends[i].y=ends[i-1].y+12;
  for(const e of ends)g+=`<text x="${(e.x+8).toFixed(1)}" y="${(e.y+3).toFixed(1)}" style="fill:${SC[e.k]};font-weight:700;font-size:11px">${e.k} ${pct(e.v)}</text>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="累計回收率走勢">${g}</svg><div class="legend">${ser.map(s=>`<span><i style="background:${SC[s.k]}"></i>${NAMES[s.k]}</span>`).join('')}</div>`;
}
function dis(T){
  const G={};for(const x of T)for(const l of x.legs||[]){const g=G[l.match+'|'+l.market]=G[l.match+'|'+l.market]||{};const o=g[x.source+'|'+l.pick];if(!o||(o.res!=="win"&&o.res!=="loss"))g[x.source+'|'+l.pick]={s:x.source,pick:l.pick,res:l.result}}
  const R={};let m=0;
  for(const g of Object.values(G)){const e=Object.values(g);if(new Set(e.map(z=>z.pick)).size<2||new Set(e.map(z=>z.s)).size<2)continue;m++;
    for(const z of e){if(z.res!=='win'&&z.res!=='loss')continue;const r=R[z.s]||(R[z.s]={n:0,w:0});r.n++;if(z.res==='win')r.w++}}
  return{R,m};
}
function insight(rows){
  const ok=rows.filter(r=>r.set>0);if(!ok.length)return'<b>尚無已結算資料</b>，等第一批結果開出後才有數字可看。';
  const sets=ok.map(r=>r.set),mn=Math.min(...sets),mx=Math.max(...sets);
  const up=ok.filter(r=>r.set>=SMALL&&r.ci!=null&&r.roi-r.ci>1),dn=ok.filter(r=>r.set>=SMALL&&r.ci!=null&&r.roi+r.ci<1);
  let m;
  if(up.length||dn.length)m=`依 95% 誤差範圍判斷：${up.length?`<b class="win">${up.map(r=>r.k).join('、')}</b> 回收率明顯高於打平`:''}${up.length&&dn.length?'；':''}${dn.length?`<b class="loss">${dn.map(r=>r.k).join('、')}</b> 回收率明顯低於打平`:''}。其餘來源的誤差範圍仍包含 100%，無法判定。`;
  else m=`各來源已結算 <b>${mn===mx?mn:mn+'～'+mx}</b> 張${mx<SMALL?`（未滿 ${SMALL} 張）`:''}，${mx<SMALL?'樣本太少，':''}回收率的誤差範圍尚未能排除 100%（打平），目前<b>無法判定誰賺誰賠、誰比較準</b>。`;
  const d=ok.filter(r=>r.ls>0&&r.lg>0).map(r=>({k:r.k,d:r.hit-r.iSum/r.lg,n:r.ls})).sort((a,b)=>b.d-a.d)[0];
  if(d)m+=` 命中率相對盤口預期最佳的是 <b>${d.k}</b>（${d.d>=0?'+':''}${(d.d*100).toFixed(0)}%，單關 ${d.n} 個），樣本小，僅供參考。`;
  return m;
}

     for(const k of dk.sort((a,b)=>dd.R[b].w/dd.R[b].n-dd.R[a].w/dd.R[a].n)){const r=dd.R[k];h+=`<tr><td>${NAMES[k]}</td><td>${r.n}</td><td>${r.w} (${pct(r.w/r.n)})${mb(r.w/r.n)}${r.n<10?'<span class="warn">樣本不足</span>':''}</td></tr>`}
     h+=`</table></div>`}
   h+=`<div class="sub" style="margin-top:6px">分歧場次 = 同一場同一盤口，不同來源選了不同的結果（本頁共 ${dd.m} 場，含未開獎）。只涵蓋被選進串關的場次，樣本偏少且有選擇偏誤，僅供參考。</div>`}
  {const M={};for(const x of T)for(const l of x.legs||[]){if((l.result!=='win'&&l.result!=='loss')||!(+l.odds>1))continue;const m=mkt(l.market),r=M[m]||(M[m]={n:0,w:0,o:0,i:0});r.n++;if(l.result==='win')r.w++;r.o+=+l.odds;r.i+=1/+l.odds}
   const ml=Object.entries(M).sort((a,b)=>b[1].n-a[1].n);
   h+=`<h3>依玩法拆分（單關）</h3><div class="tbw"><table><tr><th>玩法</th><th>單關數</th><th>命中</th><th>平均賠率</th><th>隱含機率</th><th>差距</th></tr>`;
   for(const [m,r] of ml){const a=r.w/r.n,i=r.i/r.n,d=a-i;h+=`<tr><td>${esc(m)}</td><td>${r.n}</td><td>${r.w} (${pct(a)})${mb(a)}</td><td>${(r.o/r.n).toFixed(2)}</td><td>${pct(i)}</td><td class="${d>=0?'win':'loss'}">${(d>=0?'+':'')+(d*100).toFixed(0)}%</td></tr>`}
   h+=`</table></div><div class="sub" style="margin-top:6px">玩法依盤口名稱歸類（大小 2.5／3.5…併為「大小」，讓分各線併為「讓分」）。單關數少的玩法差距參考價值低。</div>`}
  h+=`</details>`;

  // 串關清單
  h+=`<div class="sec"><h2>所有串關</h2><span>${T.length} 張</span></div><div class="chips">`+[['all','全部 '+T.length],['pending','待開獎 '+np],['win','中獎'],['loss','未中'],...(page==='claude'?[['F','穩健'],['G','平衡'],['H','價值']]:(page==='score'?'ABCDEF':'ABCDE').split('').map(k=>[k,k]))].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')+`</div><div id="list"></div>`;
  h+=`<div class="note">✓ 過關　✕ 沒過　… 未開獎　↩ 退款（以 1 計）。足球只算 90 分鐘（含傷停）。</div>`;

  const app=document.getElementById('app');app.innerHTML=h;app.hidden=false;
  const dt=app.querySelector('details.adv');if(dt)dt.ontoggle=()=>{adv=dt.open};
  app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render(D)});
  app.querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>{page=b.dataset.p;filter='all';try{localStorage.setItem('page',page)}catch(e){};render(D);window.scrollTo(0,0)});
  const L=T.filter(x=>filter==='all'||x.status===filter||x.source===filter);
  let cur='',o='';
  for(const x of L){
    if(x.round!==cur){cur=x.round;o+=`<div class="rd">${esc(cur)}</div>`;}
    const st=x.status==='win'?`<span class="pill w">中獎　回 ${Math.round(x.ret)} 元</span>`:x.status==='loss'?`<span class="pill l">未中</span>`:`<span class="pill p">待開獎　中了回 ${Math.round(100*x.odds)} 元</span>`;
    o+=`<div class="card s-${x.status==='win'||x.status==='loss'?x.status:'pending'}"><div class="hd"><span class="nm"><i style="background:${SC[x.source]||'var(--muted)'}"></i>${NAMES[x.source]||x.source}<span class="odds">總賠率 ${(+x.odds).toFixed(3)}</span></span>${st}</div>`;
    for(const l of x.legs||[]){
      o+=`<div class="leg"><div>${esc(l.match)}<div class="m">${esc(l.market)}｜${esc(l.pick)} ${l.odds}｜${t(l.start)}${l.note?'｜'+esc(l.note):''}</div></div>${MARK[l.result]||''}</div>`;
    }
    if(x.why)o+=`<div class="why">${esc(x.why)}</div>`;
    o+=`</div>`;
  }
  document.getElementById('list').innerHTML=o||`<div class="sub" style="margin-top:10px">${T.length?'沒有符合的單':'這一頁還沒有串關，下一輪排程（02:51／06:51／11:51／15:51／18:51）開始建立。'}</div>`;
}
</script>
</body>
